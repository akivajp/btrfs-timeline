<!DOCTYPE html>
<!--
  この HTML にはサーバー側のデータを一切埋め込まない。
  Cockpit モジュールにはサーバーが存在しないため、埋め込んだ瞬間に
  同じ画面を共有できなくなる。データは全て transport.js 経由で取得する。

  画面の概念は「パス」と「時点」の 2 つだけ。機能ごとにタブを分けると、
  同じ「過去を見る」操作を複数の場所で覚えることになるため、増やさない。
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>btrfs-timeline</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>btrfs-timeline</h1>
  <form id="path-form">
    <input id="path-input" type="text" spellcheck="false" autocomplete="off">
    <button type="submit" id="path-go"></button>
  </form>
  <nav id="pages">
    <a href="./index.html" id="link-history" class="current"></a>
    <a href="./devices.html" id="link-devices"></a>
  </nav>
  <label id="language-label">
    <span id="language-text"></span>
    <select id="language"></select>
  </label>
</header>

<main>
  <section id="browser" aria-labelledby="browser-title">
    <h2 id="browser-title"></h2>
    <p id="time-state">
      <span id="time-label"></span>
      <button type="button" id="time-reset" hidden></button>
      <label id="hidden-label">
        <input type="checkbox" id="show-hidden">
        <span id="hidden-text"></span>
      </label>
    </p>
    <nav id="breadcrumbs"></nav>
    <ul id="entries"></ul>
  </section>

  <section id="timeline" aria-labelledby="timeline-title">
    <h2 id="timeline-title"></h2>
    <p id="timeline-target" class="path"></p>
    <p id="timeline-hint" class="note" hidden></p>
    <table id="versions">
      <thead><tr id="versions-head"></tr></thead>
      <tbody id="versions-body"></tbody>
    </table>
    <div id="preview-box" hidden>
      <div id="preview-header">
        <h3 id="preview-title"></h3>
        <span id="preview-modes">
          <button type="button" id="mode-content" class="mode"></button>
          <button type="button" id="mode-diff" class="mode"></button>
        </span>
        <label id="diff-against-label" hidden>
          <span id="diff-against-text"></span>
          <select id="diff-against"></select>
        </label>
      </div>
      <p id="preview-note" class="note"></p>
      <pre id="preview"></pre>
    </div>
  </section>
</main>

<dialog id="restore-dialog">
  <form method="dialog">
    <h2 id="restore-title"></h2>
    <dl id="restore-details"></dl>
    <label id="in-place-label">
      <input type="checkbox" id="in-place">
      <span id="in-place-text"></span>
    </label>
    <p id="restore-warning" class="warning" hidden></p>
    <menu>
      <button value="cancel" id="restore-cancel"></button>
      <button value="confirm" id="restore-confirm" class="danger"></button>
    </menu>
  </form>
</dialog>

<p id="status" role="status"></p>

<script type="module" src="./app.js"></script>
</body>
</html>
